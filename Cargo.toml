[package]
name = "api-controller"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
slint = "1.16.1"
reqwest = "0.13.4"
env_logger = "0.11.11"
log = "0.4.33"
tokio = {version = "1.53.1", features = ["macros","rt","rt-multi-thread"]}
futures = "0.3.33"

[build-dependencies]
slint-build = "1.16.1"

[profile.release]
codegen-units = 1
lto = true